# Déclenche uniquement un déploiement Vercel via Deploy Hook.
# Utile pour tester sans lancer tout le pipeline (tests + build).
# Actions → "Trigger Vercel Deploy" → Run workflow
name: Trigger Vercel Deploy

on:
  workflow_dispatch:

jobs:
  trigger:
    name: Appeler le Deploy Hook Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          echo "Envoi du Deploy Hook à Vercel..."
          resp=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" 2>/dev/null) || true
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "Réponse HTTP: ${code:-'(vide)'}"
          echo "$body" | head -c 500
          echo ""
          if [ -z "$code" ]; then
            echo "→ Secret VERCEL_DEPLOY_HOOK_URL absent. GitHub → Settings → Secrets → Actions → ajouter VERCEL_DEPLOY_HOOK_URL."
            exit 1
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "→ Erreur Vercel: $code. Vérifiez l'URL du hook (Vercel → Deploy Hooks)."
            exit 1
          fi
          echo "Deploy Hook envoyé. Vercel → Deployments : nouveau déploiement dans 1-2 min."
