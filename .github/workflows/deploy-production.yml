name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      # Le build doit précéder le type-check : tsconfig.json inclut
      # .next/types/**/*.ts, généré uniquement par `next build`/`next dev`.
      # Sur un checkout propre, tsc échoue sinon avec des milliers de faux
      # positifs ("params possibly null"...) faute de ce dossier.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Type check
        run: npm run type-check

  trigger-vercel:
    name: Déclencher Vercel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger via Deploy Hook
        id: hook
        run: |
          URL="${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          if [ -z "$URL" ] || [ "$URL" = "" ]; then
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "→ Secret VERCEL_DEPLOY_HOOK_URL absent. GitHub → Settings → Secrets and variables → Actions → New repository secret : VERCEL_DEPLOY_HOOK_URL"
            echo "→ Créer le hook : Vercel → projet EDUZEN → Settings → Git → Deploy Hooks → Create Hook (Branch: main)"
            exit 0
          fi
          echo "Envoi du Deploy Hook à Vercel..."
          echo "URL du hook (début): ${URL:0:50}..."
          resp=$(curl -s -w "\n%{http_code}" -X POST "$URL")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "Réponse HTTP: ${code:-'(vide)'}"
          echo "$body" | head -c 800
          echo ""

          if [ "$code" = "200" ] || [ "$code" = "201" ]; then
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "Deploy Hook accepté. Vérifier dans 1-2 min : Vercel → Deployments"
          else
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "→ Erreur: Vercel a répondu $code. Vérifier l'URL du hook (Vercel → Settings → Git → Deploy Hooks)."
            echo "→ Si 401/403 : recréer le Deploy Hook sur Vercel et mettre à jour le secret."
            exit 1
          fi

      - name: Trigger via API (si hook absent)
        if: steps.hook.outputs.status == 'missing'
        run: |
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}"
          if [ -z "$TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "Pas de VERCEL_TOKEN/VERCEL_PROJECT_ID. Déploiement uniquement via Deploy Hook."
            exit 0
          fi
          echo "Déclenchement via API Vercel..."
          curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"project\": \"$PROJECT_ID\", \"target\": \"production\", \"gitSource\": {\"type\": \"github\", \"ref\": \"main\", \"repoId\": \"${{ github.repository_id }}\"}}" \
            | head -c 500
          echo ""
          echo "Requête API envoyée. Vérifier Vercel → Deployments."

  healthcheck:
    name: Healthcheck post-déploiement
    runs-on: ubuntu-latest
    needs: trigger-vercel
    steps:
      - name: Vérifier /api/health
        run: |
          URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$URL" ]; then
            echo "→ Secret PRODUCTION_URL absent. GitHub → Settings → Secrets and variables → Actions → New repository secret : PRODUCTION_URL (ex: https://app.eduzen.io)"
            echo "→ Sans ce secret, aucun healthcheck automatique n'est fait après le déploiement."
            exit 0
          fi

          echo "Attente du build Vercel avant de vérifier ${URL}/api/health ..."
          for i in $(seq 1 20); do
            sleep 15
            code=$(curl -s -o /tmp/health_body.json -w "%{http_code}" "${URL}/api/health" || echo "000")
            echo "Tentative $i/20 → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ Healthcheck OK"
              cat /tmp/health_body.json
              exit 0
            fi
          done

          echo "❌ Healthcheck en échec après 5 minutes (dernier code: $code)."
          echo "→ Le déploiement Vercel a été déclenché mais /api/health ne répond pas correctement."
          echo "→ Vérifier Vercel → Deployments, et envisager de repromouvoir le déploiement précédent (Vercel → Deployments → ... → Promote to Production)."
          cat /tmp/health_body.json 2>/dev/null
          exit 1
