name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run all tests
        run: |
          npm run test -- --run
          npm run test:integration -- --run || echo "Integration tests skipped"
          npm run test:e2e || echo "E2E tests skipped"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      
      - name: Deploy to Vercel (Production) via API
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_DEPLOY_HOOK_URL == '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Trigger Vercel Deploy Hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Déclenchement du déploiement Vercel via Deploy Hook..."
          curl -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" || { echo "Deploy Hook failed"; exit 1; }
          echo "Deploy Hook envoyé avec succès."
      
      - name: Aucun déploiement Vercel configuré
        if: ${{ secrets.VERCEL_TOKEN == '' && secrets.VERCEL_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "Aucun déploiement Vercel configuré."
          echo "Ajoutez soit VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID, soit VERCEL_DEPLOY_HOOK_URL."
          echo "Voir docs/DEPLOIEMENT_VERCEL.md"
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Example: curl health check
          # curl -f https://your-production-url.com/api/health || exit 1



